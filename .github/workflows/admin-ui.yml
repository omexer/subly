name: Admin UI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: admin-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint:js

      - run: npm run test:unit

      - run: npm run build

      # The built assets are committed, because a plugin installed from a zip has no
      # build step. A diff here means someone changed source and shipped stale assets.
      - name: Built assets are current
        run: git diff --exit-code -- build/
